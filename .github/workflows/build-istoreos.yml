name: Build iStoreOS for Netcore N60 Pro

on:
  workflow_dispatch:
    inputs:
      include_docker:
        description: "包含 Docker（勾选=包含，会增大固件）"
        type: boolean
        default: true

env:
  REPO_URL: https://github.com/istoreos/istoreos
  REPO_BRANCH: istoreos-25.12
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 清理磁盘空间
        run: |
          df -hT
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/CodeQL_bundle
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          df -hT

      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libncursesw5-dev \
            libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp \
            nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync sasl2-bin ssh-client squashfs-tools subversion swig \
            texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          sudo -E timedatectl set-timezone Asia/Shanghai

      - name: 克隆 iStoreOS 源码
        run: |
          git clone --depth 1 -b $REPO_BRANCH $REPO_URL openwrt
          cd openwrt
          echo "源码版本: $(git log -1 --format='%h %cd' --date=short)"

      - name: 更新 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 生成编译配置（Netcore N60 Pro）
        run: |
          cd openwrt
          cat $GITHUB_WORKSPACE/seed.config >> .config
          if [ "${{ inputs.include_docker }}" = "true" ]; then
            echo 'CONFIG_PACKAGE_docker=y' >> .config
            echo 'CONFIG_PACKAGE_dockerd=y' >> .config
            echo 'CONFIG_PACKAGE_luci-app-dockerman=y' >> .config
            echo 'CONFIG_PACKAGE_luci-i18n-dockerman-zh-cn=y' >> .config
          fi
          make defconfig
          echo "=== 确认目标设备 ==="
          grep -E "CONFIG_TARGET_(mediatek|BOARD)" .config | head -5
          grep "DEVICE_netcore_n60-pro=y" .config || (echo "!! 目标设备未生效" && exit 1)

      - name: 预下载源码包
        run: |
          cd openwrt
          make download -j$(nproc)
          find dl -size -1024c -exec ls -la {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: 编译固件
        id: compile
        run: |
          cd openwrt
          echo "COMPILE_START=$(date +%s)" >> $GITHUB_ENV
          make -j$(nproc) || make -j1 V=s
          echo "COMPILE_END=$(date +%s)" >> $GITHUB_ENV
          echo "=== 编译产物 ==="
          ls -lh bin/targets/mediatek/filogic/

      - name: 整理产物
        run: |
          cd openwrt/bin/targets/mediatek/filogic
          rm -rf packages
          mkdir -p $GITHUB_WORKSPACE/output
          cp -f * $GITHUB_WORKSPACE/output/ 2>/dev/null || true
          cd $GITHUB_WORKSPACE/output
          for f in *; do echo "sha256sum: $f"; sha256sum "$f"; done > SHA256SUMS.txt

      - name: 上传固件 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: istoreos-netcore-n60-pro
          path: ${{ github.workspace }}/output
          retention-days: 90
